<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Class Arkanoid Game</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <h1>Arkanoid Maths Class Game</h1>

    <section class="game-card">
      <canvas id="gameCanvas" width="800" height="600"></canvas>

      <div class="controls">
        <p><strong>Controls:</strong></p>
        <p>Move: ← → arrow keys or A / D</p>
        <p>Launch / Restart: Space</p>
      </div>
    </section>

    <section class="teacher-note">
      <h2>Teacher note</h2>
      <p>
        This is a simple browser-based Arkanoid game made with HTML, CSS and JavaScript.
        It can be hosted for free on GitHub Pages.
      </p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
