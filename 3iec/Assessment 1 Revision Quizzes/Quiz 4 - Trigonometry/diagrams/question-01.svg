<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 300">
<title>Question 1: Triangle ABC, right angle at B. AB is 15 cm, BC is 8 cm and hypotenuse AC is 17 cm. Find sin A.</title>
