<polygon points="80.000,230.000 380.000,230.000 380.000,70.000" fill="none" stroke="#111827" stroke-width="2.5" stroke-linejoin="round"/>
<text x="59.709" y="235.411" text-anchor="middle" dominant-baseline="middle" class="vertex">A</text>
<text x="398.529" y="239.882" text-anchor="middle" dominant-baseline="middle" class="vertex">B</text>
<text x="394.363" y="54.680" text-anchor="middle" dominant-baseline="middle" class="vertex">C</text>
<text x="230.000" y="253.000" text-anchor="middle" dominant-baseline="middle" class="value">15 cm</text>
<text x="410.000" y="150.000" text-anchor="middle" dominant-baseline="middle" class="value">8 cm</text>
<text x="219.176" y="129.706" text-anchor="middle" dominant-baseline="middle" class="value">17 cm</text>
<path d="M110.000,230.000 A30,30 0 0,0 106.471,215.882" fill="none" stroke="#4338ca" stroke-width="1.5"/>
