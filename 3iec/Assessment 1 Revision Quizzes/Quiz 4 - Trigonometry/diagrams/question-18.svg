<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 300">
<title>Question 18: Triangle AOB formed by two paths from O. OA is 7 km, OB is 10 km and angle AOB is 134 degrees. Find straight-line distance AB.</title>
<style>text{font-family:Arial,Helvetica,sans-serif;font-size:20px;paint-order:stroke;stroke:white;stroke-width:5px;stroke-linejoin:round} .vertex{font-size:19px;font-weight:bold;fill:#111827} .value{fill:#075985} .angle{font-size:19px;fill:#4338ca;font-weight:bold}</style>
<polygon points="178.151,200.819 80.000,99.181 380.000,200.819" fill="none" stroke="#111827" stroke-width="2.5" stroke-linejoin="round"/>
<text x="163.154" y="215.519" text-anchor="middle" dominant-baseline="middle" class="vertex">O</text>
<text x="61.297" y="89.632" text-anchor="middle" dominant-baseline="middle" class="vertex">A</text>
<text x="400.582" y="204.988" text-anchor="middle" dominant-baseline="middle" class="vertex">B</text>
<text x="107.495" y="170.840" text-anchor="middle" dominant-baseline="middle" class="value">7 km</text>
<text x="279.076" y="223.819" text-anchor="middle" dominant-baseline="middle" class="value">10 km</text>
<text x="237.380" y="128.216" text-anchor="middle" dominant-baseline="middle" class="value">AB = ?</text>
<path d="M157.311,179.239 A30,30 0 0,1 208.151,200.819" fill="none" stroke="#4338ca" stroke-width="1.5"/>
<text x="199.251" y="151.112" text-anchor="middle" dominant-baseline="middle" class="angle">134°</text>
</svg>
